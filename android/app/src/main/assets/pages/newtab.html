<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<script src="/ui/i18n.js"></script>
<style>
/* One centered column: clock, date, search pill, then a grid of shortcuts the user can add, edit, remove and drag. */
:root {
  --page: #ffffff;
  --fg: #17191d;
  --muted: #646a74;
  --faint: #9aa0a9;
  --tile: #f3f4f6;
  --tile-hover: #e9ebee;
  --line: rgba(15, 23, 42, 0.1);
  --pop: #ffffff;
  --accent: #0d9a87;
  --glow: rgba(13, 154, 135, 0.10);
  --glow2: rgba(28, 104, 214, 0.08);
  --danger: #e5484d;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 28px rgba(15, 23, 42, 0.08);
  --shadow-pop: 0 0 0 1px rgba(15, 23, 42, 0.08), 0 24px 64px rgba(15, 23, 42, 0.22);
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #202124; --fg: #ececef; --muted: #a2a6ad; --faint: #6e737b;
    --tile: #2a2b2f; --tile-hover: #323338; --line: rgba(255, 255, 255, 0.1); --pop: #222327;
    --accent: #35c9b1; --glow: rgba(53, 201, 177, 0.10); --glow2: rgba(60, 130, 240, 0.08);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 64px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(900px 420px at 30% -10%, var(--glow), transparent 70%),
    radial-gradient(800px 380px at 80% -5%, var(--glow2), transparent 70%),
    var(--page);
  color: var(--fg); font: 14px/1.4 var(--ui);
  display: grid; place-items: start center; padding: max(10vh, 48px) 20px 40px; overflow-x: hidden;
}
body.plain { background: var(--page); }
main { width: min(640px, 100%); display: flex; flex-direction: column; align-items: center; gap: 28px; }
.in { animation: up 0.6s var(--ease) both; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }

.clock { text-align: center; }
#time { font: 200 clamp(56px, 11vw, 92px)/1 var(--display); letter-spacing: -2px; font-variant-numeric: tabular-nums; }
#date { margin-top: 8px; color: var(--muted); font-size: 15px; }

form#f { width: 100%; position: relative; animation-delay: 0.06s; }
.pill {
  width: 100%; height: 54px; border-radius: 27px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
  background: var(--page); box-shadow: var(--shadow); border: 1px solid var(--line);
  transition: box-shadow 0.2s var(--ease), border-color 0.2s;
}
.pill:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 4px var(--glow); }
.pill svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--faint); stroke-width: 1.8; stroke-linecap: round; }
#q { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; color: var(--fg); font: 16px var(--ui); }
#q::placeholder { color: var(--faint); }

.sites { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.site { position: relative; border-radius: 14px; animation: up 0.5s var(--ease) both; transition: background 0.18s, transform 0.18s var(--ease), opacity 0.18s; }
.site:hover, .site.menu-open { background: var(--tile); transform: translateY(-2px); }
.site.dragging { opacity: 0.35; }
.site.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
.site.drop-after { box-shadow: inset -3px 0 0 var(--accent); }
.site > a, .site > button.tile {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 8px 12px; border-radius: 14px;
  text-decoration: none; color: var(--fg); background: none; border: 0; font: inherit; cursor: pointer;
}
.site > a:active, .site > button.tile:active { transform: scale(0.97); }
.site > a:focus-visible, .site > button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 48px; height: 48px; border-radius: 14px; background: var(--tile); display: grid; place-items: center; font: 600 18px var(--display); color: var(--muted); transition: background 0.18s; }
.site:hover .ico { background: var(--tile-hover); }
.ico img { width: 24px; height: 24px; border-radius: 4px; }
.ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.name, .lbl { max-width: 100%; font-size: 12.5px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.add .ico { background: none; border: 1.5px dashed var(--line); }
.add:hover .ico { background: var(--tile-hover); border-color: transparent; }
.more {
  position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 8px; border: 0; background: none; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s;
}
.more svg { width: 16px; height: 16px; fill: currentColor; }
.site:hover .more, .site.menu-open .more, .more:focus-visible { opacity: 1; }
.more:hover { background: var(--tile-hover); color: var(--fg); }
@media (hover: none) { .more { opacity: 1; } }   /* phones: no hover, so the button always shows */
.empty { color: var(--faint); font-size: 13px; text-align: center; animation-delay: 0.12s; margin: -12px 0 0; }

/* the little menu on a shortcut */
.menu {
  position: fixed; z-index: 5; min-width: 168px; padding: 5px; border-radius: 11px; background: var(--pop); box-shadow: var(--shadow-pop);
  animation: pop 0.16s var(--ease) both;
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
.menu button { width: 100%; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--fg); font: 13px var(--ui); text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--tile); outline: none; }
.menu button.danger { color: var(--danger); }
.menu svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* add / edit dialog */
dialog {
  width: min(400px, calc(100vw - 32px)); padding: 22px 22px 18px; border: 0; border-radius: 16px; background: var(--pop); color: var(--fg); box-shadow: var(--shadow-pop);
}
dialog[open] { animation: pop 0.2s var(--ease) both; }
dialog::backdrop { background: rgba(12, 16, 24, 0.28); backdrop-filter: blur(3px); }
dialog h2 { margin: 0 0 16px; font: 600 18px var(--display); }
dialog label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 12.5px; color: var(--muted); }
dialog input {
  height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--tile); color: var(--fg); font: 14px var(--ui); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
dialog input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
dialog input.bad { border-color: var(--danger); }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.actions button { height: 36px; padding: 0 16px; border-radius: 9px; border: 0; font: 600 13px var(--ui); cursor: pointer; background: var(--tile); color: var(--fg); }
.actions button:hover { background: var(--tile-hover); }
.actions .primary { background: var(--accent); color: #fff; }
.actions .primary:hover { background: var(--accent); filter: brightness(1.07); }

@media (max-width: 520px) { .sites { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="clock in" id="clock"><div id="time">--:--</div><div id="date"></div></div>
  <form class="in" id="f" autocomplete="off">
    <label class="pill"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search the web or enter address" spellcheck="false" aria-label="Search the web or enter address"></label>
  </form>
  <div class="sites" id="sites"></div>
  <p class="empty in" id="empty" hidden>Sites you visit often will show up here.</p>
</main>
<dialog id="dlg">
  <form method="dialog" id="dlgForm" autocomplete="off">
    <h2 id="dlgTitle">Add shortcut</h2>
    <label>Name<input id="dlgName" maxlength="60" spellcheck="false"></label>
    <label>URL<input id="dlgUrl" spellcheck="false" placeholder="example.com"></label>
    <div class="actions"><button type="button" id="dlgCancel">Cancel</button><button type="submit" class="primary" id="dlgOk">Done</button></div>
  </form>
</dialog>
<script>
"use strict";
const engines = { google: "Google", bing: "Bing", duckduckgo: "DuckDuckGo", brave: "Brave Search" };
const Accents = { teal: ["#0d9a87", "#35c9b1"], blue: ["#2563eb", "#5b9cff"], purple: ["#7c3aed", "#a78bfa"], pink: ["#db2777", "#f472b6"], orange: ["#ea580c", "#fb923c"], graphite: ["#4b5563", "#a1a7b3"] };
const Max = 12;
const $ = s => document.querySelector(s);
const wv = window.driftHost;
let sites = [], accent = "teal", dragFrom = -1;

function tick() {
  const now = new Date();
  $("#time").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("#date").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
}
tick();
setInterval(tick, 1000);

const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const alpha = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)}, ${parseInt(hex.slice(3, 5), 16)}, ${parseInt(hex.slice(5, 7), 16)}, ${a})`;
function applyAccent() {
  const c = (Accents[accent] || Accents.teal)[darkQuery.matches ? 1 : 0];
  document.documentElement.style.setProperty("--accent", c);
  document.documentElement.style.setProperty("--glow", alpha(c, 0.10));
}
darkQuery.addEventListener("change", applyAccent);

$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#q").value.trim();
  if (v && wv) wv.postMessage({ type: "go", input: v });
});

/* ---------- shortcuts ---------- */
const svgNs = "http://www.w3.org/2000/svg";
function icon(paths) {
  const s = document.createElementNS(svgNs, "svg"); s.setAttribute("viewBox", "0 0 24 24");
  s.innerHTML = paths;
  return s;
}
function save(list) {
  sites = list;
  $("#empty").hidden = true;   // the list is the user's own now
  render();
  if (wv) wv.postMessage({ type: "setShortcuts", items: list.map(s => ({ name: s.name, url: s.url })) });
}

function render() {
  const box = $("#sites");
  box.textContent = "";
  sites.forEach((s, i) => {
    const tile = document.createElement("div");
    tile.className = "site"; tile.draggable = true; tile.dataset.i = i;
    tile.style.animationDelay = (0.1 + i * 0.035) + "s";
    const a = document.createElement("a");
    a.href = s.url; a.title = s.url; a.draggable = false;
    const ico = document.createElement("span"); ico.className = "ico";
    const letter = (s.name || "?").charAt(0).toUpperCase();
    if (s.favicon) {
      const img = document.createElement("img"); img.src = s.favicon; img.alt = "";
      img.onerror = () => { ico.textContent = letter; };
      ico.appendChild(img);
    } else ico.textContent = letter;
    const name = document.createElement("span"); name.className = "name"; name.textContent = s.name;
    a.append(ico, name);
    const more = document.createElement("button");
    more.type = "button"; more.className = "more"; more.title = T("More actions");
    more.appendChild(icon('<circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/>'));
    more.onclick = e => { e.preventDefault(); e.stopPropagation(); openMenu(tile, i); };
    tile.append(a, more);
    dragHandlers(tile, i);
    box.appendChild(tile);
  });
  if (sites.length < Max) {
    const tile = document.createElement("div");
    tile.className = "site add";
    tile.style.animationDelay = (0.1 + sites.length * 0.035) + "s";
    const b = document.createElement("button"); b.type = "button"; b.className = "tile";
    const ico = document.createElement("span"); ico.className = "ico";
    ico.appendChild(icon('<path d="M12 5v14M5 12h14"/>'));
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = T("Add shortcut");
    b.append(ico, lbl);
    b.onclick = () => openDialog(-1);
    tile.appendChild(b);
    box.appendChild(tile);
  }
}

/* drag a shortcut onto another to move it there */
function dragHandlers(tile, i) {
  tile.addEventListener("dragstart", e => { dragFrom = i; tile.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/uri-list", sites[i].url); });
  tile.addEventListener("dragend", () => { dragFrom = -1; document.querySelectorAll(".site").forEach(t => t.classList.remove("dragging", "drop-before", "drop-after")); });
  tile.addEventListener("dragover", e => {
    if (dragFrom < 0 || dragFrom === i) return;
    e.preventDefault();
    const r = tile.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
    tile.classList.toggle("drop-after", after); tile.classList.toggle("drop-before", !after);
  });
  tile.addEventListener("dragleave", () => tile.classList.remove("drop-before", "drop-after"));
  tile.addEventListener("drop", e => {
    if (dragFrom < 0 || dragFrom === i) return;
    e.preventDefault();
    const after = tile.classList.contains("drop-after");
    const list = sites.slice(), [moved] = list.splice(dragFrom, 1);
    let to = i + (after ? 1 : 0);
    if (dragFrom < to) to--;
    list.splice(to, 0, moved);
    dragFrom = -1;
    save(list);
  });
}

/* the ⋮ menu: edit or remove */
let menu = null;
function closeMenu() {
  if (!menu) return;
  menu.el.remove(); menu.tile.classList.remove("menu-open");
  menu = null;
}
function openMenu(tile, i) {
  const again = menu && menu.tile === tile;
  closeMenu();
  if (again) return;
  const el = document.createElement("div"); el.className = "menu"; el.setAttribute("role", "menu");
  const item = (label, paths, run, cls) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "menuitem");
    if (cls) b.className = cls;
    b.append(icon(paths), T(label));
    b.onclick = () => { closeMenu(); run(); };
    el.appendChild(b);
  };
  item("Edit shortcut", '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', () => openDialog(i));
  item("Remove", '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>', () => save(sites.filter((_, n) => n !== i)), "danger");
  document.body.appendChild(el);
  const r = tile.getBoundingClientRect(), w = el.offsetWidth;
  el.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px";
  const below = r.bottom + 4;
  el.style.top = (below + el.offsetHeight + 8 > innerHeight ? Math.max(8, r.top - el.offsetHeight - 4) : below) + "px";
  tile.classList.add("menu-open");
  menu = { el, tile };
  el.querySelector("button").focus();
}
document.addEventListener("pointerdown", e => { if (menu && !menu.el.contains(e.target) && !e.target.closest(".more")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
addEventListener("blur", closeMenu);

/* add / edit */
const dlg = $("#dlg");
let editing = -1;
function openDialog(i) {
  editing = i;
  const s = sites[i];
  $("#dlgTitle").textContent = T(s ? "Edit shortcut" : "Add shortcut");
  $("#dlgName").value = s ? s.name : "";
  $("#dlgUrl").value = s ? s.url : "";
  $("#dlgUrl").classList.remove("bad");
  dlg.showModal();
  (s ? $("#dlgName") : $("#dlgUrl")).focus();
}
const looksLikeAddress = v => /^(https?:\/\/)?[^\s/]+\.[^\s/]{2,}(\/\S*)?$/i.test(v) || /^(https?:\/\/)?localhost(:\d+)?(\/\S*)?$/i.test(v);
function nameFor(url) {
  try { return new URL(/^https?:\/\//i.test(url) ? url : "https://" + url).hostname.replace(/^www\./, ""); } catch { return url; }
}
$("#dlgForm").addEventListener("submit", e => {
  e.preventDefault();
  const url = $("#dlgUrl").value.trim();
  if (!looksLikeAddress(url)) { $("#dlgUrl").classList.add("bad"); $("#dlgUrl").focus(); return; }
  const full = /^https?:\/\//i.test(url) ? url : "https://" + url;
  const name = $("#dlgName").value.trim() || nameFor(full);
  const list = sites.slice();
  const prev = list[editing];
  const item = { name, url: full, favicon: prev && prev.url === full ? prev.favicon : null };
  if (editing >= 0) list[editing] = item; else list.push(item);
  dlg.close();
  save(list);
});
$("#dlgUrl").addEventListener("input", () => $("#dlgUrl").classList.remove("bad"));
$("#dlgCancel").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // a click on the backdrop

if (wv) {
  wv.addEventListener("message", e => {
    const m = e.data;
    if (!m || m.type !== "topSites") return;
    accent = m.accent || "teal"; applyAccent();
    $("#clock").hidden = m.clock === false;
    document.body.classList.toggle("plain", m.background === "plain");
    const show = m.shortcuts !== false;
    $("#sites").hidden = !show;
    sites = m.sites || [];
    if (show) render();
    $("#empty").hidden = !show || !!m.custom || sites.length > 0;
    const n = engines[m.engine];
    if (n) $("#q").placeholder = T(`Search ${n} or enter address`);
  });
  wv.postMessage({ type: "hello" });
} else {
  render();
}
</script>
</body>
</html>
