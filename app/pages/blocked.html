<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page blocked</title>
<style>
/* One centered warning card with the blocked address and two choices. */
:root {
  --page: #ffffff; --fg: #17191d; --muted: #646a74; --faint: #9aa0a9; --line: rgba(15, 23, 42, 0.1);
  --warn: #c2410c; --warn-soft: rgba(194, 65, 12, 0.1); --btn: #f1f2f4; --btn-hover: #e6e8eb;
  --accent: #0d9a87; --accent-ink: #ffffff;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #202124; --fg: #ececef; --muted: #a2a6ad; --faint: #6e737b; --line: rgba(255, 255, 255, 0.1);
          --warn: #fb923c; --warn-soft: rgba(251, 146, 60, 0.14); --btn: #2a2b2f; --btn-hover: #323338;
          --accent: #35c9b1; --accent-ink: #04162e; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--fg); font: 14px/1.5 var(--ui); display: grid; place-items: center; padding: 24px; }
main { width: min(520px, 100%); animation: up 0.5s var(--ease) both; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }
.icon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); margin-bottom: 20px; }
.icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0 0 8px; font: 600 24px/1.25 var(--display); text-wrap: balance; }
p { margin: 0 0 14px; color: var(--muted); }
.url { padding: 10px 12px; border-radius: 10px; background: var(--btn); font: 12.5px/1.4 "Cascadia Mono", Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
button { font: 600 13.5px var(--ui); height: 38px; padding: 0 18px; border-radius: 9px; border: 0; cursor: pointer; transition: background 0.15s, transform 0.1s; }
button:active { transform: scale(0.97); }
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:hover { filter: brightness(1.06); }
.quiet { background: none; color: var(--muted); font-weight: 500; }
.quiet:hover { background: var(--btn); color: var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-2.9 8.1-7 9.5-4.1-1.4-7-5.2-7-9.5V6z"/><path d="M12 8v5M12 16.5v.01"/></svg></div>
  <h1>Drift blocked this page</h1>
  <p id="why">This site is on a list of pages known for scams, malware or deceptive downloads.</p>
  <div class="url" id="url"></div>
  <div class="row">
    <button class="primary" id="back" autofocus>Go back to safety</button>
    <button class="quiet" id="go">Continue anyway</button>
  </div>
</main>
<script>
"use strict";
let info = {};
try { info = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
document.getElementById("url").textContent = info.url || "";
if (info.list && info.host) document.getElementById("why").textContent =
  `“${info.list}” lists ${info.host} as a risk: a page known for scams, malware or deceptive downloads.`;
const wv = window.driftHost;
document.getElementById("back").onclick = () => wv && wv.postMessage({ type: "back" });
document.getElementById("go").onclick = () => wv && info.url && wv.postMessage({ type: "proceed", url: info.url });
</script>
</body>
</html>
